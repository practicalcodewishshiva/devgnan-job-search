# Postiz — schedule posts to every social platform (#06). Upstream: https://github.com/gitroomhq/postiz-app
# Adapted from docker-compose.yaml: secrets/port parameterised, debug-only Spotlight and the
# Temporal admin/UI containers dropped. dynamicconfig/ is vendored unchanged.
# Social network API keys (LinkedIn, X, Instagram, ...) go in apps/postiz/.env — see README.
name: biz-postiz

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:${POSTIZ_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      MAIN_URL: ${POSTIZ_URL}
      FRONTEND_URL: ${POSTIZ_URL}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_URL}/api
      JWT_SECRET: ${JWT_SECRET:?run ./stack.sh init}
      DATABASE_URL: postgresql://postiz:${DB_PASSWORD}@postiz-postgres:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: ${POSTIZ_DISABLE_REGISTRATION:-false}
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      API_LIMIT: 30
      NX_ADD_PLUGINS: "false"
    volumes:
      - postiz_config:/config/
      - postiz_uploads:/uploads/
    ports:
      - "${BIND_IP:-127.0.0.1}:${POSTIZ_PORT:-4007}:5000"
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started

  postiz-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run ./stack.sh init}
      POSTGRES_DB: postiz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postiz -d postiz
      interval: 5s
      timeout: 3s
      retries: 20

  postiz-redis:
    image: redis:7.2
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal_es:/usr/share/elasticsearch/data

  temporal-postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?run ./stack.sh init}
    volumes:
      - temporal_db:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

volumes:
  postiz_config:
  postiz_uploads:
  postgres_data:
  redis_data:
  temporal_es:
  temporal_db:
