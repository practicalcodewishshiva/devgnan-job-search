# Twenty — open-source CRM (#11). Upstream: https://github.com/twentyhq/twenty
# Adapted from packages/twenty-docker/docker-compose.yml (port + secrets parameterised).
name: biz-twenty

x-twenty-env: &twenty-env
  PG_DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/default
  SERVER_URL: ${TWENTY_URL}
  REDIS_URL: redis://redis:6379
  STORAGE_TYPE: local
  APP_SECRET: ${APP_SECRET:?run ./stack.sh init}

services:
  server:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 120s
    ports:
      - "${BIND_IP:-127.0.0.1}:${TWENTY_PORT:-3001}:3000"
    environment:
      <<: *twenty-env
      NODE_PORT: 3000
    volumes:
      - server_data:/app/packages/twenty-server/.local-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 60

  worker:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - server_data:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run ./stack.sh init}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  server_data:
