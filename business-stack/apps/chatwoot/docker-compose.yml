# Chatwoot — live chat, email & WhatsApp inbox (#12). Upstream: https://github.com/chatwoot/chatwoot
# Adapted from docker-compose.production.yaml. The rails service runs the idempotent
# `db:chatwoot_prepare` task on every start, so no manual migration step is needed.
name: biz-chatwoot

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:${CHATWOOT_TAG:-latest}
  restart: unless-stopped
  environment: &chatwoot-env
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run ./stack.sh init}
    FRONTEND_URL: ${CHATWOOT_URL}
    ENABLE_ACCOUNT_SIGNUP: ${CHATWOOT_SIGNUP:-false}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DATABASE: chatwoot
    POSTGRES_USERNAME: postgres
    POSTGRES_PASSWORD: ${DB_PASSWORD:?run ./stack.sh init}
    REDIS_URL: redis://redis:6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?run ./stack.sh init}
    ACTIVE_STORAGE_SERVICE: local
    RAILS_LOG_TO_STDOUT: "true"
    MAILER_SENDER_EMAIL: ${SMTP_FROM:-}
    SMTP_ADDRESS: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *chatwoot
    ports:
      - "${BIND_IP:-127.0.0.1}:${CHATWOOT_PORT:-3004}:3000"
    entrypoint: docker/entrypoints/rails.sh
    command: ["sh", "-c", "bundle exec rails db:chatwoot_prepare && exec bundle exec rails s -p 3000 -b 0.0.0.0"]
    depends_on: [postgres, redis]

  sidekiq:
    <<: *chatwoot
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on: [postgres, redis]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
