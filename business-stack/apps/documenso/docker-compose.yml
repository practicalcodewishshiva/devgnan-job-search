# Documenso — e-signatures (#09). Upstream: https://github.com/documenso/documenso
# Adapted from docker/production/compose.yml. The signing certificate is generated by
# `./stack.sh init` (self-signed .p12) — replace it with a real one for legal-grade signing.
name: biz-documenso

services:
  documenso:
    image: documenso/documenso:${DOCUMENSO_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${DOCUMENSO_PORT:-3003}:3000"
    environment:
      PORT: 3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?run ./stack.sh init}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run ./stack.sh init}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${ENCRYPTION_SECONDARY_KEY:?run ./stack.sh init}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_URL}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://documenso:${DB_PASSWORD}@db:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://documenso:${DB_PASSWORD}@db:5432/documenso
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      NEXT_PRIVATE_SMTP_PORT: ${SMTP_PORT:-2500}
      NEXT_PRIVATE_SMTP_USERNAME: ${SMTP_USER:-}
      NEXT_PRIVATE_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Documenso}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${SMTP_FROM:-noreply@example.com}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${SIGNING_PASSPHRASE:-}
    volumes:
      - ./cert.p12:/opt/documenso/cert.p12:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run ./stack.sh init}
      POSTGRES_DB: documenso
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso -d documenso"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
