# n8n — workflow automation (#14). Upstream: https://github.com/n8n-io/n8n
# Based on https://docs.n8n.io/hosting/installation/docker/
name: biz-n8n

services:
  n8n:
    image: n8nio/n8n:${N8N_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${PUBLIC_HOST:-localhost}
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: ${PUBLIC_SCHEME:-http}
      WEBHOOK_URL: ${N8N_URL}
      N8N_EDITOR_BASE_URL: ${N8N_URL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run ./stack.sh init}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      TZ: ${TZ:-Asia/Kolkata}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:?run ./stack.sh init}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  n8n_data:
  db_data:
